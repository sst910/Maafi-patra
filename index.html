<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maaf Kiya? ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scene">
    <div class="stars"></div>

    <section class="card" id="card">
      <div class="intro" id="intro">
        <div class="heart">❤️</div>
        <h1>Ek chhoti si sorry...</h1>
        <p class="subtitle">He has something to say.</p>
      </div>

      <div class="couple-area">
        <div class="character man" id="man">
          <div class="head"><span class="hair"></span><span class="eye left"></span><span class="eye right"></span></div>
          <div class="body"></div>
          <div class="arm left-arm"></div>
          <div class="arm right-arm"></div>
          <div class="leg left-leg"></div>
          <div class="leg right-leg"></div>
          <div class="shoe left-shoe"></div>
          <div class="shoe right-shoe"></div>
        </div>

        <div class="character woman" id="woman">
          <div class="head"><span class="hair"></span><span class="eye left"></span><span class="eye right"></span></div>
          <div class="body"></div>
          <div class="arm left-arm"></div>
          <div class="arm right-arm"></div>
          <div class="leg left-leg"></div>
          <div class="leg right-leg"></div>
          <div class="shoe left-shoe"></div>
          <div class="shoe right-shoe"></div>
        </div>
      </div>

      <div class="speech" id="speech">Sorry... 🥺</div>

      <div class="counter">
        <span id="count">0</span> sorry squats
      </div>

      <button class="forgive-btn" id="forgiveBtn">Maaf Kiya ❤️</button>

      <div class="ending" id="ending">
        <div class="tears">🥹</div>
        <h2>Maaf kar diya...</h2>
        <p>Sometimes one little apology brings two hearts closer.</p>
        <div class="final-heart">❤️</div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
