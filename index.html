<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bas Ek Baar Maaf Kar Do ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span></div>

<main class="card">
  <div class="top">
    <div class="tiny">A LITTLE APOLOGY FROM THE HEART</div>
    <h1>Bas ek baar <em>maaf</em> kar do...</h1>
    <p id="message">Dekho, galti ho gayi... aur ab dekho main kya kar raha hoon 🥺</p>
  </div>

  <section class="stage" id="stage">
    <div class="thought" id="thought">Please maan jao... 🥺</div>

    <div class="person man" id="man">
      <div class="name">HIM</div>
      <div class="head"><i class="hair"></i><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div>
      <div class="torso"></div>
      <div class="ear-hand hand1"></div><div class="ear-hand hand2"></div>
      <div class="arm a1"></div><div class="arm a2"></div>
      <div class="leg l1"></div><div class="leg l2"></div>
      <div class="shoe s1"></div><div class="shoe s2"></div>
    </div>

    <div class="person girl" id="girl">
      <div class="name">HER</div>
      <div class="head"><i class="hair"></i><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div>
      <div class="torso"></div>
      <div class="arm a1"></div><div class="arm a2"></div>
      <div class="leg l1"></div><div class="leg l2"></div>
      <div class="shoe s1"></div><div class="shoe s2"></div>
    </div>

    <div class="floor"></div>
  </section>

  <div class="counter"><strong id="count">0</strong> <span>sorry squats</span></div>
  <button id="forgive">Maaf Kiya ❤️</button>
  <div class="hint">Psst... ek button hai. Tum jaanti ho kaunsa 😌</div>

  <div class="finale" id="finale">
    <div class="sparkles">✦ ✧ ✦</div>
    <div class="emoji" id="finalEmoji">🥹</div>
    <h2 id="finalTitle">Sach mein maaf kar diya?</h2>
    <p id="finalText">Ab idhar aao...</p>
    <div class="heart-big">♥</div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
